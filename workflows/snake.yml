name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake animation (neon green)
        uses: Platane/snk@v3
        with:
          github_user_name: krishnakant9
          outputs: |
            output/github-contribution-grid-snake.svg?palette=github-dark&color_snake=39FF14&color_dots=0D1117,0A2E0A,145214,1E7A1E,39FF14
            output/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=39FF14&color_dots=0D1117,0A2E0A,145214,1E7A1E,39FF14

      - name: Push output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
